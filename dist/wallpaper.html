<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>酒狐 · 云上小日子</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#dce6e8;color:#263e37;font-family:system-ui,"Microsoft YaHei",sans-serif}canvas{display:block;width:100vw;height:100vh;touch-action:none}header{position:absolute;top:28px;left:32px;pointer-events:none}header small{font-size:10px;letter-spacing:3px;color:#607b70}h1{font-size:25px;font-weight:500;margin:10px 0}header p{font-size:12px;line-height:1.8;margin:0;color:#61776d}.badge{position:absolute;right:28px;top:28px;border-radius:30px;background:#fbfcf4d9;padding:10px 16px;font-size:12px}.panel{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);display:flex;gap:6px;background:#fffdf2eb;border:1px solid #fff;border-radius:16px;padding:8px;box-shadow:0 8px 35px #23453315}button{border:0;background:transparent;color:#3f554a;padding:11px 16px;border-radius:10px;cursor:pointer;white-space:nowrap;font:13px inherit}button:hover{background:#e2e8d9}button[aria-pressed=true]{background:#365947;color:#fff}button:focus-visible{outline:3px solid #cd9c57}footer{position:absolute;left:30px;bottom:30px;font-size:10px;color:#536a60;line-height:1.8;pointer-events:none}#status{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#fffcf0;padding:20px;border-radius:12px;font-size:14px;max-width:80vw}body.night{color:#e5eadb}body.night header p,body.night header small,body.night footer{color:#d2dcca}body.night .badge{background:#243b36;color:#e5eadb}@media(max-width:720px){header{left:18px;top:18px}h1{font-size:20px}header p{font-size:11px;max-width:220px}.badge{top:auto;bottom:92px;right:16px;font-size:10px}footer{left:18px;bottom:90px;font-size:9px}.panel{bottom:20px;padding:5px;gap:0}button{padding:10px;font-size:12px}}
  .regions{position:absolute;top:158px;left:30px;display:flex;gap:3px;background:#fffdf2df;border-radius:12px;padding:5px;max-width:calc(100vw - 36px);overflow:auto}.regions button{padding:8px 12px;font-size:12px}.night .regions{background:#243b36}.night .regions button{color:#e5eadb}@media(max-width:720px){.regions{top:144px;left:18px}.regions button{padding:8px 9px;font-size:11px}footer{bottom:130px}.badge{bottom:93px;left:18px;right:auto}} .resident-card{position:absolute;left:30px;top:218px;display:flex;align-items:center;gap:10px;background:#fffdf2eb;border-radius:14px;padding:12px;color:#3f554a}.resident-card img{width:42px;height:54px;object-fit:contain;image-rendering:pixelated}.resident-card strong{font-size:15px}.resident-card small{font-size:8px;letter-spacing:1px;font-weight:400;margin-left:8px}.resident-card p{font-size:11px;margin:5px 0 8px}.resident-card label{font-size:10px;margin-right:4px}.resident-card select{font:11px system-ui;border:1px solid #c7d1be;border-radius:5px;padding:4px;background:#f9faef;color:#3f554a}.resident-card button{font-size:11px;padding:6px 8px;margin-left:3px;background:#e4eadb}.night .resident-card{background:#243b36;color:#e5eadb}@media(max-width:720px){.resident-card{left:18px;top:197px;padding:9px;width:calc(100vw - 36px);gap:7px}.resident-card img{width:34px;height:44px}.resident-card strong{font-size:13px}.resident-card p{font-size:10px}} .auto-row{display:flex;align-items:center;gap:6px;margin-top:7px}.auto-row span{font-size:10px}.resident-card button[aria-pressed=true]{background:#365947;color:#fff}.life-controls{position:absolute;right:28px;top:83px;padding:13px 16px;background:#fffdf2eb;border-radius:14px;color:#3f554a}.life-controls strong{display:block;font-size:13px;margin-bottom:9px}.life-controls label,.life-controls small{font-size:10px}.life-controls select{font:11px system-ui;padding:5px;border:1px solid #c7d1be;border-radius:5px;background:#f9faef;color:#3f554a;margin:0 8px 0 5px}.life-controls button{font-size:11px;padding:6px 10px;background:#e4eadb}.life-controls small{display:block;margin-top:7px;opacity:.7}.night .life-controls{background:#243b36;color:#e5eadb}.panel{max-width:calc(100vw - 30px);flex-wrap:wrap;justify-content:center}button{font-family:inherit}@media(max-width:1000px){.life-controls{top:auto;bottom:102px;left:18px;right:auto}.badge{display:none}footer{display:none}}@media(max-width:480px){.life-controls{left:18px;right:18px;bottom:100px;padding:10px 12px}.life-controls select{margin-right:5px}.resident-card select{max-width:103px}.panel{width:calc(100vw - 30px)}} .panel{width:max-content}@media(max-width:480px){.panel{width:calc(100vw - 30px)}} </style>
<link rel="stylesheet" href="wallpaper.css">
</head>
<body class="wallpaper-clean">
  <canvas id="world" aria-label="可旋转缩放的浮空岛"></canvas>
  <header><small>JIUHU'S SKY ISLAND</small><h1>云上生活，慢慢长大。</h1><p>扩建小岛 · 六处生活风景<br>拖动旋转与俯仰 · 滚轮或双指缩放</p></header>
  <nav class="regions" aria-label="选择岛上区域"><button data-view="all" aria-pressed="true">全岛</button><button data-view="home" aria-pressed="false">小屋</button><button data-view="garden" aria-pressed="false">菜园</button><button data-view="river" aria-pressed="false">溪桥</button><button data-view="mill" aria-pressed="false">风车</button><button data-view="lookout" aria-pressed="false">凉亭</button></nav><div class="badge" id="badge">128×128 材质 · 本地加载</div>
  <aside class="resident-card" aria-label="酒狐日常生活"><img id="resident-portrait" alt="酒狐像素角色"><div><strong>酒狐 <small>JIU HU</small></strong><p id="resident-status" aria-live="polite">正在来到小岛…</p><label for="resident-place">安排活动</label><select id="resident-place"><option value="home">休息</option><option value="wheat">麦田除草</option><option value="garden">菜园除虫</option><option value="tree">树下小憩</option><option value="cook">炒菜</option><option value="eat">吃饭</option><option value="sleep">回床睡觉</option><option value="pond">钓鱼</option><option value="sweep">扫地</option><option value="shelter">檐下躲雨雪</option><option value="fire">篝火取暖</option></select><button id="resident-focus">跟随酒狐</button><div class="auto-row"><span id="resident-mode">自在生活</span><button id="resident-auto" aria-pressed="true">恢复自在生活</button></div></div></aside><section class="life-controls" aria-label="时间与天气"><strong id="world-time">白天 09:00 · 晴天</strong><div><label for="weather">天气</label><select id="weather"><option value="auto">自然变化</option><option value="clear">晴天</option><option value="cloud">多云</option><option value="rain">下雨</option><option value="snow">下雪</option></select><label for="speed">流速</label><select id="speed"><option value="1">正常</option><option value="4">4 倍</option><option value="12">12 倍</option></select><button id="pause" aria-pressed="false">暂停</button></div><small>正常流速下，一天约 8 分钟</small></section><nav class="panel" aria-label="小岛控制">
    <button id="textured" aria-pressed="true">材质版</button><button id="plain" aria-pressed="false">纯色版</button>
    <button id="atmosphere" aria-pressed="true">柔和光影：开</button><button id="light" aria-pressed="false">夜间</button><button id="roof" aria-pressed="false">查看屋内</button><button id="reset">复位</button>
  </nav>
  <footer class="system-time"><time id="system-clock"></time><div id="system-date"></div></footer>
  <div id="status" role="status">正在把小岛搬上云端…</div>
  <button id="debug-toggle" aria-pressed="true">Debug · 关闭调试</button>
<script src="wallpaper.js"></script>
<script src="wallpaper.bundle.js"></script>
</body>
</html>
