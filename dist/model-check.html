<!doctype html><html><meta charset="utf-8"><style>body{margin:0;background:#bac9d1}canvas{display:block}p{position:absolute;top:10px;left:20px;font:14px sans-serif}</style><p>模型检查 · 拖动旋转</p><script type="module">import * as T from './vendor/three.module.js';import{loadImportedMap}from './imported-map.js';const s=new T.Scene();s.background=new T.Color('#becfd5');const r=new T.WebGLRenderer({antialias:true});r.setSize(innerWidth,innerHeight);document.body.append(r.domElement);const c=new T.PerspectiveCamera(45,innerWidth/innerHeight,.1,200);s.add(new T.HemisphereLight(0xffffff,0x8a8068,2));const l=new T.DirectionalLight(0xffefd5,3);l.position.set(10,20,10);s.add(l);const {group}=await loadImportedMap();s.add(group);let a=.7,p=1.3,d=24,drag=false,x=0,y=0;r.domElement.onpointerdown=e=>{drag=true;x=e.clientX;y=e.clientY;r.domElement.setPointerCapture(e.pointerId)};r.domElement.onpointerup=e=>{drag=false;const ray=new T.Raycaster();ray.setFromCamera(new T.Vector2(e.clientX/innerWidth*2-1,-e.clientY/innerHeight*2+1),c);const hit=ray.intersectObject(group,true)[0];if(hit)document.querySelector('p').textContent='位置 '+hit.point.toArray().map(v=>v.toFixed(3)).join(', ')};r.domElement.onpointermove=e=>{if(drag){a-=(e.clientX-x)*.008;p=T.MathUtils.clamp(p+(e.clientY-y)*.006,.05,1.5);x=e.clientX;y=e.clientY}};r.domElement.onwheel=e=>{d=T.MathUtils.clamp(d+e.deltaY*.02,12,60)};function frame(){requestAnimationFrame(frame);c.position.set(Math.sin(a)*Math.cos(p)*d,3+Math.sin(p)*d,Math.cos(a)*Math.cos(p)*d);c.lookAt(0,3,0);r.render(s,c)}frame();</script></html>
