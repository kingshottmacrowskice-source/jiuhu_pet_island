<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>酒狐 · 动画图鉴</title><style>body{margin:0;padding:35px;background:#293e49;color:#f2e5ca;font:14px system-ui}h1{font-size:24px}a{color:#e9c57d}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px;margin-top:30px}article{background:#344d58;border-radius:12px;text-align:center;padding:20px}canvas{width:168px;height:192px;image-rendering:pixelated}small{display:block;margin:12px}button{padding:10px;background:#e9c57d;border:0;border-radius:8px}</style><h1>酒狐 · 动画图鉴</h1><p>同向连续动作 · 待机呼吸与眨眼 · 仅保留侧面睡姿</p><a href="./">返回小岛</a> <button id="pause">暂停动画</button><main id="gallery"></main><script type="module">
import {loadSprites} from './sprites.js';const {clips}=await loadSprites();const entries=[['walk','行走',8],['sweep','扫地',5],['0','站立待机',3],['3','除草',3],['4','除虫',3],['5','树下小憩',3],['6','炒菜',3],['7','吃饭',3],['8','侧面睡觉',1.2],['10','篝火打盹',1.2],['11','钓鱼',3],['14','檐下躲雨',3],['15','篝火闲坐',3]];const cards=entries.map(([key,name,fps])=>{const card=document.createElement('article'),c=document.createElement('canvas'),title=document.createElement('small');c.width=56;c.height=64;title.textContent=name+' / '+clips[key].length+' 帧';card.append(c,title);document.getElementById('gallery').append(card);return {c,key,fps}});let paused=false,t=0,last=performance.now();document.getElementById('pause').onclick=()=>{paused=!paused;document.getElementById('pause').textContent=paused?'继续动画':'暂停动画'};function tick(now){if(!paused)t+=Math.max(0,(now-last)/1000);last=now;for(const {c,key,fps} of cards){const frames=clips[key],image=frames[Math.floor(t*fps)%frames.length].image,ctx=c.getContext('2d');ctx.clearRect(0,0,56,64);ctx.imageSmoothingEnabled=false;ctx.drawImage(image,(56-image.width)/2,64-image.height)}requestAnimationFrame(tick)}requestAnimationFrame(tick);
</script></html>
